name: Garder Supabase éveillé

# Un projet Supabase gratuit est mis en pause après ~7 jours sans activité.
on:
  schedule:
    - cron: '17 6 */3 * *'   # tous les 3 jours à 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/items?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" > /dev/null
          echo "Supabase a répondu."
